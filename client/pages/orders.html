<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Setup & Gear Orders | PixelGear</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .orders-list-layout {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .order-summary-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: var(--transition);
    }

    .order-summary-card:hover {
      border-color: var(--accent-cyan);
      box-shadow: var(--shadow-neon);
    }

    .order-meta-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .order-id-label {
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .order-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      width: fit-content;
    }

    .order-status-badge.processing { background-color: rgba(59, 130, 246, 0.15); color: #3b82f6; }
    .order-status-badge.shipped { background-color: rgba(245, 158, 11, 0.15); color: #f59e0b; }
    .order-status-badge.delivered { background-color: rgba(16, 185, 129, 0.15); color: #10b981; }
    .order-status-badge.cancelled { background-color: rgba(239, 110, 110, 0.15); color: #ef4444; }

    /* Invoice styles */
    .invoice-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 3rem;
      margin-top: 2rem;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      position: relative;
    }

    .invoice-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3rem;
    }

    .invoice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      margin-bottom: 3rem;
    }

    .invoice-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2rem;
    }

    .invoice-table th, .invoice-table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .invoice-table th {
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .invoice-totals {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.75rem;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      .invoice-card, .invoice-card * {
        visibility: visible;
      }
      .invoice-card {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        border: none;
        box-shadow: none;
        padding: 0;
      }
      .print-btn-invoice {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header>
    <div class="container nav-bar">
      <a href="/" class="logo">
        <i class="fa-solid fa-keyboard"></i> Pixel<span>Keys</span>
      </a>
      <ul class="nav-menu">
        <li class="nav-item"><a href="/">Home</a></li>
        <li class="nav-item"><a href="/shop">Shop</a></li>
        <li class="nav-item"><a href="/wishlist">Wishlist</a></li>
        <li class="nav-item active"><a href="/orders">Orders</a></li>
      </ul>
      <div class="nav-actions">
        <button id="theme-toggle" class="nav-btn" aria-label="Toggle Theme">
          <i class="fas fa-sun"></i>
        </button>
        <a href="/wishlist" class="nav-btn" aria-label="Wishlist">
          <i class="fas fa-heart"></i>
          <span id="wishlist-badge" class="badge" style="display: none;">0</span>
        </a>
        <a href="/cart" class="nav-btn" aria-label="Shopping Cart">
          <i class="fas fa-shopping-cart"></i>
          <span id="cart-badge" class="badge" style="display: none;">0</span>
        </a>
        
        <!-- User Menu Dropdown -->
        <div class="user-menu-container">
          <a href="/login" id="login-link" class="btn btn-secondary" style="padding: 0.5rem 1.25rem; font-size: 0.9rem;">Sign In</a>
          <button id="user-menu-btn" class="nav-btn" style="display: none; width: auto; padding: 0 1rem; border-radius: 20px; gap: 0.5rem;" aria-label="User profile menu">
            <i class="fas fa-user-circle"></i>
            <span>User</span>
          </button>
          <div id="user-dropdown" class="dropdown-menu">
            <a href="/profile" class="dropdown-item"><i class="fas fa-user"></i> My Profile</a>
            <a href="/admin" id="dropdown-admin-link" class="dropdown-item" style="display: none;"><i class="fas fa-cog"></i> Admin Panel</a>
            <a href="#" id="logout-btn" class="dropdown-item" style="border-top: 1px solid var(--card-border);"><i class="fas fa-sign-out-alt"></i> Logout</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Orders Content Area -->
  <main class="container">
    
    <!-- View 1: Listing past orders -->
    <div id="orders-list-view">
      <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem;">Order History</h1>
      <p style="color: var(--text-secondary); margin-bottom: 2rem;">Track build shipments and download previous invoices.</p>
      
      <div id="orders-list-container" class="orders-list-layout">
        <!-- populated list -->
        <div class="skeleton-card" style="height: 100px;"></div>
      </div>
    </div>

    <!-- View 2: Invoice Detail view -->
    <div id="order-invoice-view" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <button class="btn btn-secondary" onclick="backToOrdersList()"><i class="fas fa-arrow-left"></i> Back to History</button>
        <button class="btn btn-primary print-btn-invoice" onclick="window.print()"><i class="fas fa-print"></i> Print Invoice</button>
      </div>

      <div class="invoice-card" id="invoice-details-card">
        <!-- Dynamically filled -->
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer>
    <div class="container footer-grid">
      <div class="footer-col" style="grid-column: span 2;">
        <a href="/" class="footer-logo"><i class="fa-solid fa-keyboard"></i> PixelGear</a>
        <p style="color: var(--text-secondary); line-height: 1.6; margin-bottom: 1.5rem;">PixelGear is the ultimate hub for gamers and e-sports enthusiasts.</p>
      </div>
    </div>
    <div class="container footer-bottom">
      <p>&copy; 2026 PixelGear Co. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/orders.js"></script>
</body>
</html>
